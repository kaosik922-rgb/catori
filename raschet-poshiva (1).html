<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расчёт стоимости пошива</title>
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;padding:16px;background:#f5f5f5;color:#222;font-size:14px;}
.container{max-width:1100px;margin:0 auto;}
h1{font-size:20px;margin:0 0 16px;}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.header-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.header-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:12px;color:#666;font-weight:500;}
input,select,textarea{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;font-family:inherit;width:100%;}
input:focus,select:focus{outline:2px solid #4a90d9;border-color:transparent;}
button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;background:#4a90d9;color:#fff;font-weight:500;}
button:hover{background:#3a7bc0;}
button.secondary{background:#e0e0e0;color:#333;}
button.secondary:hover{background:#d0d0d0;}
button.danger{background:#e74c3c;padding:4px 10px;font-size:12px;}
button.danger:hover{background:#c0392b;}
button.small{padding:4px 10px;font-size:12px;}
button.green{background:#27ae60;}
button.green:hover{background:#229954;}
.room{border:1px solid #e0e0e0;border-radius:8px;margin-bottom:12px;}
.room-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f9f9f9;border-radius:8px 8px 0 0;cursor:pointer;flex-wrap:wrap;}
.room-header input[type="checkbox"]{width:auto;}
.room-header select{width:auto;flex:1;max-width:200px;}
.room-body{padding:14px;display:none;}
.room.open .room-body{display:block;}
.room-total{margin-left:auto;font-weight:600;color:#2c3e50;}
.item{border:1px solid #eee;border-radius:6px;margin-bottom:12px;padding:12px;}
.item-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;flex-wrap:wrap;}
.item-header select{width:auto;flex:1;min-width:150px;}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr auto;gap:8px;margin-bottom:8px;align-items:center;}
.dims{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;margin-bottom:8px;align-items:center;}
.dims span{font-size:13px;color:#555;}
@media(max-width:700px){.dims{grid-template-columns:1fr 1fr;}}
.sum{font-weight:600;color:#2c3e50;text-align:right;}
.sum small{color:#e67e22;font-weight:500;font-size:11px;display:block;}
.subtotal{display:flex;justify-content:space-between;padding:10px 0;border-top:1px dashed #ccc;margin-top:10px;font-weight:600;}
.grand-total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:16px 0;border-top:2px solid #2c3e50;margin-top:16px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.hint{font-size:12px;color:#888;margin:6px 0;}
.line-row{display:grid;grid-template-columns:2.5fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:6px;align-items:center;font-size:13px;}
.line-row.custom{grid-template-columns:2fr 1fr 1fr 1fr auto;}
@media(max-width:700px){.line-row,.line-row.custom{grid-template-columns:1fr 1fr;}}
.line-sum{font-weight:600;color:#2c3e50;text-align:right;padding-right:6px;}
.markup-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
@media(max-width:700px){.markup-list{grid-template-columns:1fr;}}
.markup-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fafafa;border-radius:6px;font-size:13px;flex-wrap:wrap;}
.markup-item input[type="checkbox"]{width:auto;}
.markup-item .pct{margin-left:auto;color:#666;font-weight:600;}
.hidden{display:none;}
.add-buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.auto-block{background:#f0f7ff;border:1px solid #cce4ff;border-radius:6px;padding:10px;margin:10px 0;}
.auto-title{font-size:12px;color:#2c5f9e;font-weight:600;margin-bottom:6px;}
.auto-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:6px;align-items:center;}
@media(max-width:700px){.auto-row{grid-template-columns:1fr 1fr;}}
.auto-info{font-size:11px;color:#555;margin-top:4px;}
.radio-group{display:flex;gap:8px;font-size:12px;flex-wrap:wrap;}
.radio-group label{display:flex;align-items:center;gap:4px;cursor:pointer;}
.radio-group input[type="radio"]{width:auto;}
.synth-block{background:#f5fff0;border:1px solid #d4ecc5;border-radius:6px;padding:10px;margin:10px 0;}
.synth-title{font-size:12px;color:#3d7a1a;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.synth-title input[type="checkbox"]{width:auto;}
.master-block{background:#fdf5ff;border:1px solid #e8d0f0;border-radius:6px;padding:10px;margin:10px 0;}
.master-title{font-size:12px;color:#7a3d99;font-weight:600;margin-bottom:6px;}
.master-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;align-items:center;}
@media(max-width:700px){.master-row{grid-template-columns:1fr;}}
.saved-list{max-height:400px;overflow-y:auto;}
.saved-item{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #eee;}
.saved-item:hover{background:#f9f9f9;}
.saved-info{flex:1;}
.saved-name{font-weight:600;}
.saved-date{font-size:12px;color:#888;}
.saved-sum{font-weight:600;color:#2c3e50;white-space:nowrap;}
@media print{
  @page{size:A4;margin:12mm;}
  body{background:#fff;padding:0;font-size:10px;line-height:1.25;}
  .no-print{display:none!important;}
  .container{max-width:100%;}
  .card{box-shadow:none;padding:0;margin:0;}
  .print-doc{display:block!important;}
  .print-doc h1{text-align:center;font-size:14px;margin:0 0 8px;letter-spacing:.5px;}
  .print-header{font-size:10px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #000;}
  .print-header div{display:inline-block;margin-right:16px;}
  .print-room{margin-bottom:10px;page-break-inside:auto;}
  .print-room h2{font-size:11px;font-weight:700;text-transform:uppercase;margin:8px 0 4px;padding:3px 0;border-bottom:1px solid #000;background:none;letter-spacing:.3px;}
  .print-item{margin-bottom:4px;page-break-inside:avoid;}
  .print-item h3{font-size:10px;font-weight:600;margin:0 0 2px;}
  .print-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:2px;}
  .print-table td{padding:1px 4px 1px 0;vertical-align:top;}
  .print-table td:last-child{text-align:right;white-space:nowrap;padding-right:0;font-variant-numeric:tabular-nums;}
  .print-subtotal{text-align:right;font-weight:600;font-size:10px;padding:2px 0 4px;margin-bottom:4px;}
  .print-item .print-subtotal{border-top:0;font-size:10px;}
  .print-room > .print-subtotal{border-top:1px solid #999;padding-top:3px;font-size:10px;}
  .print-grand{text-align:right;font-size:13px;font-weight:700;padding:6px 0;border-top:2px solid #000;border-bottom:2px solid #000;margin-top:10px;}
  .print-markups{font-size:10px;margin:6px 0;}
  .print-markups div{margin-bottom:2px;}
}
</style>
</head>

<div class="container">

<div class="no-print">
  <h1>🧮 Расчёт стоимости пошива</h1>

  <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;">
    <button onclick="newOrder()">📄 Новый расчёт</button>
    <button class="secondary" onclick="showSaved()">📁 Мои расчёты</button>
    <button class="secondary" onclick="saveToCloud()">💾 Сохранить в список</button>
    <button class="secondary" onclick="exportBackup()">📤 Резервная копия</button>
    <button class="secondary" onclick="importBackup()">📥 Восстановить</button>
  </div>

  <div class="card" id="savedPanel" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <b>📁 Мои расчёты</b>
      <button class="small secondary" onclick="hideSaved()">Закрыть</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  </div>

  <div class="card">
    <div class="header-grid">
      <div class="field"><label>Номер заказа</label><input type="text" id="orderNum" placeholder="например, 244"></div>
      <div class="field"><label>Дата готовности</label><input type="text" id="readyDate" placeholder="например, 15.10.2026"></div>
      <div class="field"><label>Дизайнер</label><input type="text" id="designer" placeholder="ФИО дизайнера"></div>
      <div class="field"><label>Название проекта</label><input type="text" id="projectName" placeholder="например, RED 7"></div>
    </div>
  </div>

  <div id="roomsContainer"></div>
  <button onclick="addRoom()" style="width:100%;padding:12px;">+ Добавить комнату</button>

  <div class="card" style="margin-top:16px;">
    <div style="font-size:13px;color:#666;font-weight:600;margin-bottom:8px;">Общие наценки по заказу</div>
    <div class="markup-list">
      <div class="markup-item"><input type="checkbox" id="urgency50"><span>Срочно (3-4 дня)</span><span class="pct">+50%</span></div>
      <div class="markup-item"><input type="checkbox" id="urgency100"><span>Очень срочно (1-2 дня)</span><span class="pct">+100%</span></div>
    </div>
  </div>

  <div class="card">
    <div class="subtotal"><span>Сумма по всем комнатам:</span><span id="roomsTotal">0 ₽</span></div>
    <div class="subtotal"><span>Общие наценки:</span><span id="markupsTotal">0 ₽</span></div>
    <div class="grand-total"><span>ИТОГО ПО ПРОЕКТУ:</span><span id="grandTotal">0 ₽</span></div>
    <div class="actions">
      <button onclick="printDoc()">🖨 Печать / PDF</button>
      <button class="green" onclick="printMasters()">👥 Ведомость ЗП</button>
    </div>
  </div>
</div>

<div class="print-doc hidden" id="printDoc"></div>
<div class="print-doc hidden" id="printMastersDoc"></div>
</div>

// Экранирование текста, введённого пользователем (кавычки и < не ломают разметку)
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function isCoverCategory(cat){ return cat === 'Покрывала и подушки'; }
function isCoverWork(wn){ return /Покрывало/i.test(wn||''); }
function isTulleCategory(cat){ return cat === 'Тюль'; }
function isPorteraCategory(cat){ return cat === 'Портьеры на подкладке' || cat === 'Портьеры без подкладки'; }
function isRomanCategory(cat){ return cat === 'Римские шторы'; }

function addRoom(){
  state.rooms.push({id:'room_'+(++roomCounter),name:'Гостиная',customName:'',enabled:true,open:true,items:[]});
  render();
}
function removeRoom(rid){
  if(!confirm('Удалить комнату со всеми изделиями?')) return;
  state.rooms = state.rooms.filter(r=>r.id!==rid);
  render();
}
function toggleRoom(rid,f){
  const r = state.rooms.find(x=>x.id===rid);
  if(!r) return;
  if(f==='enabled') r.enabled = !r.enabled;
  if(f==='open') r.open = !r.open;
  render();
}
function setRoomName(rid,v){ const r = state.rooms.find(x=>x.id===rid); if(r){ r.name = v; render(); } }
function setCustomName(rid,v){ const r = state.rooms.find(x=>x.id===rid); if(r) r.customName = v; }

function addItem(rid){
  const r = state.rooms.find(x=>x.id===rid);
  if(!r) return;
  r.items.push({
    id:'item_'+(++itemCounter),
    category:'Портьеры на подкладке',
    mainWork:'', mainQty:1,
    lines:[], markups:{}, height:'', width:'',
    seamType:0, seamVert:0, seamHoriz:0,
    decorIdx:DECOR_TYPES[0], decorDir:'perimeter', decorCount:0,
    synthEnabled:false, synthType:0,
    velcroEnabled:false,
    romanCircles:false, romanAssembly:false,
    masterIdx:0, masterCuts:true
  });
  render();
}
function removeItem(rid,iid){
  const r = state.rooms.find(x=>x.id===rid);
  if(!r) return;
  r.items = r.items.filter(i=>i.id!==iid);
  render();
}
function getItem(rid,iid){
  const r = state.rooms.find(x=>x.id===rid);
  return r ? r.items.find(i=>i.id===iid) : null;
}
function updateItem(rid,iid,f,v){
  const it = getItem(rid,iid);
  if(!it) return;
  it[f] = v;
  // Автовключение синтепона
  if(f==='mainWork' && isCoverCategory(it.category) && isCoverWork(v)) it.synthEnabled = true;
  if(f==='category'){
    if(!isCoverCategory(v)) it.synthEnabled = false;
    it.velcroEnabled = isRomanCategory(v);
    if(!isRomanCategory(v)){
      it.romanCircles = false;
      it.romanAssembly = false;
    }
  }
  // Автовыбор "кроит сама" при выборе швеи
  if(f==='masterIdx'){
    it.masterCuts = (v === 0); // Швея 1 (индекс 0) по умолчанию кроит сама
  }
}

function updateMainQty(rid,iid,v){
  const it = getItem(rid,iid);
  if(!it) return;
  const nq = parseFloat(v)||0;
  it.mainQty = nq;
  it.lines.forEach(l=>{
    if(l.source==='material' && MATERIALS[l.ref] && /Шторная лента/.test(MATERIALS[l.ref].name)){
      if(l.autoSync) l.qty = nq;
    }
  });
  recalc();
}

function autoAddTape(rid,iid){
  const it = getItem(rid,iid);
  if(!it) return;
  if(!/шторной ленте|шт\. ленте|по шт\.л/i.test(it.mainWork||'')) return;
  const hasTape = it.lines.some(l=>l.source==='material' && MATERIALS[l.ref] && /Шторная лента/.test(MATERIALS[l.ref].name));
  if(hasTape) return;
  const ti = MATERIALS.findIndex(m=>m.name==='Шторная лента с кордами 6 см, 1:2');
  if(ti>=0) it.lines.push({source:'material',ref:ti,qty:it.mainQty||0,autoSync:true});
}

}

function fmt(n){ return Math.round(n).toLocaleString('ru-RU')+' ₽'; }

function getMainWork(it){
  const list = PRICE[it.category]||[];
  return list.find(w=>w.name===it.mainWork) || null;
}

// Минимум 2м для портьер и тюля (только для основной работы)
function getEffectiveQty(it){
  let q = parseFloat(it.mainQty)||0;
  if((isTulleCategory(it.category) || isPorteraCategory(it.category)) && q < 2 && q > 0){
    q = 2;
  }
  return q;
}

function calcDecorMeters(it){
  const h = parseFloat(it.height)||0;
  const w = parseFloat(it.width)||0;
  const c = parseFloat(it.decorCount)||0;
  if(c <= 0) return 0;
  if(it.decorDir === 'vert') return c * h;
  if(it.decorDir === 'horiz') return c * w;
  if(it.decorDir === 'perimeter') return c * 2 * (w + h);
  return 0;
}

function calcItem(it){
  const work = getMainWork(it);
  const r = {base:0,effectivePrice:0,basePct:0,baseWithMarkups:0,baseMarkupsSum:0,
    linesSum:0,materialsSum:0,volumeMarkupsSum:0,workVolume:0,
    total:0,work:null,qty:0,linesList:[],volumeMarkupsList:[],baseMarkupsList:[]};
  if(!work) return r;

  const rawQty = parseFloat(it.mainQty)||0;
  const effQty = getEffectiveQty(it); // с минимумом 2м
  const base = work.price * effQty;
  r.work = work; r.qty = rawQty; r.effQty = effQty; r.base = base;

  let linesSum = 0, materialsSum = 0;
  const linesList = [];
  const h = parseFloat(it.height)||0;
  const w = parseFloat(it.width)||0;

  // Стачные швы (авто)
  const seamOp = EXTRA_OPS[0];
  if(seamOp && it.seamVert > 0 && h > 0){
    const q = it.seamVert * h;
    const sum = q * seamOp.price;
    linesSum += sum;
    linesList.push({name:seamOp.name+' (вертикальный, '+it.seamVert+' шт.)',unit:'м',qty:q,price:seamOp.price,sum,source:'extra',auto:true});
  }
  if(seamOp && it.seamHoriz > 0 && w > 0){
    const q = it.seamHoriz * w;
    const sum = q * seamOp.price;
    linesSum += sum;
    linesList.push({name:seamOp.name+' (горизонтальный, '+it.seamHoriz+' шт.)',unit:'м',qty:q,price:seamOp.price,sum,source:'extra',auto:true});
  }

  // Декор (авто)
  const decorOp = EXTRA_OPS[it.decorIdx];
  const decorM = calcDecorMeters(it);
  if(decorOp && decorM > 0){
    const sum = decorM * decorOp.price;
    linesSum += sum;
    const dir = it.decorDir==='vert'?'верт.':(it.decorDir==='horiz'?'гориз.':'по периметру');
    linesList.push({name:decorOp.name+' ('+dir+', '+it.decorCount+' шт.)',unit:'м',qty:decorM,price:decorOp.price,sum,source:'extra',auto:true});
  }

  // Липучка велкро (авто, для римских)
  if(it.velcroEnabled && w > 0){
    const vi = MATERIALS.findIndex(m=>m.name==='Лента липучка "велкро" 2,5 см');
    if(vi>=0){
      const mat = MATERIALS[vi];
      const sum = mat.price * w;
      linesSum += sum; materialsSum += sum;
      linesList.push({name:mat.name+' (авто, по ширине шторы)',unit:'м',qty:w,price:mat.price,sum,source:'material',auto:true});
    }
  }

  // Колечки для римских (авто, опционально)
  if(it.romanCircles && w > 0 && h > 0){
    const op = EXTRA_OPS[22]; // Вставить колечко в шторную ленту
    const area = w * h;
    const sum = area * op.price;
    linesSum += sum;
    linesList.push({name:op.name+' (авто, площадь '+area.toFixed(2)+' кв.м)',unit:'кв.м',qty:area,price:op.price,sum,source:'extra',auto:true});
  }

  // Сборка на карниз (авто, опционально)
  if(it.romanAssembly && w > 0 && h > 0){
    const op = EXTRA_OPS[25]; // Сборка римской шторы на карниз
    const area = w * h;
    const sum = area * op.price;
    linesSum += sum;
    linesList.push({name:op.name+' (авто, площадь '+area.toFixed(2)+' кв.м)',unit:'кв.м',qty:area,price:op.price,sum,source:'extra',auto:true});
  }

  // Синтепон (авто, для покрывал)
  if(it.synthEnabled && w > 0 && h > 0){
    const synth = SYNTH_TYPES[it.synthType||0];
    const sq = Math.min(w, h);
    if(sq > 0){
      const sum = synth.price * sq;
      linesSum += sum; materialsSum += sum;
      linesList.push({name:synth.name+' (авто, по короткой стороне)',unit:'м',qty:sq,price:synth.price,sum,source:'material',auto:true});
    }
  }

  // Обычные строки
  (it.lines||[]).forEach(l=>{
    let name='',unit='',price=0;
    if(l.source==='extra'){
      const op=EXTRA_OPS[l.ref]; if(op){name=op.name;unit=op.unit;price=op.price;}
    } else if(l.source==='material'){
      const mat=MATERIALS[l.ref]; if(mat){name=mat.name;unit=mat.unit;price=mat.price;}
    } else {
      name=l.name||'Своя операция'; unit=l.unit||'м'; price=l.price||0;
    }
    if(name){
      const sum = price * (l.qty||0);
      linesSum += sum;
      if(l.source==='material') materialsSum += sum;
      const dn = l.note ? name+' — '+l.note : name;
      linesList.push({name:dn,unit,qty:l.qty||0,price,sum,source:l.source});
    }
  });
  r.linesSum = linesSum; r.materialsSum = materialsSum; r.linesList = linesList;

  // Базовые наценки
  let basePct = 0;
  const baseMarkupsList = [], volumeMarkupsList = [];
  const mk = it.markups||{};
  MARKUPS.forEach(m=>{
    const val = mk[m.id];
    if(!val) return;
    const bt = (typeof val==='object' && val.base) ? val.base : 'base';
    if(bt==='base'){ basePct += m.pct; baseMarkupsList.push({name:m.name,pct:m.pct}); }
    else { volumeMarkupsList.push({name:m.name,pct:m.pct}); }
  });

  // Наценка за высоту (вариант А: floor)
  if(h > 3.1){
    const extra = Math.floor(h - 3.1);
    const pct = extra * 30;
    if(pct > 0){
      basePct += pct;
      baseMarkupsList.push({name:`Высота >3,1 м (+${pct}% за ${extra} м)`,pct});
    }
  }

  const effPrice = work.price * (1 + basePct/100);
  const baseWithMarkups = effPrice * effQty;
  const baseMarkupsSum = baseWithMarkups - base;
  r.effectivePrice = effPrice; r.basePct = basePct;
  r.baseWithMarkups = baseWithMarkups; r.baseMarkupsSum = baseMarkupsSum;
  r.baseMarkupsList = baseMarkupsList;

  // Объёмные наценки (от пошива с базовыми + допы без материалов)
  const workVolume = baseWithMarkups + (linesSum - materialsSum);
  r.workVolume = workVolume;
  let vms = 0;
  const vmList = [];
  volumeMarkupsList.forEach(m=>{
    const sum = workVolume * m.pct / 100;
    vms += sum;
    vmList.push({name:m.name,pct:m.pct,sum});
  });
  r.volumeMarkupsSum = vms; r.volumeMarkupsList = vmList;
  r.total = baseWithMarkups + linesSum + vms;
  return r;
}

function calcRoom(r){
  if(!r.enabled) return 0;
  return (r.items||[]).reduce((s,i)=>s+calcItem(i).total,0);
}
function calcAllRooms(){ return state.rooms.reduce((s,r)=>s+calcRoom(r),0); }
function urgencyPct(st){ return (st.urgency50?0.5:0) + (st.urgency100?1.0:0); }

function recalc(){
  const rt = calcAllRooms();
  const mt = rt * urgencyPct(state);
  const e1=document.getElementById('roomsTotal');
  const e2=document.getElementById('markupsTotal');
  const e3=document.getElementById('grandTotal');
  if(e1) e1.textContent = fmt(rt);
  if(e2) e2.textContent = fmt(mt);
  if(e3) e3.textContent = fmt(rt+mt);
  state.rooms.forEach(r=>{
    const el = document.getElementById('room_total_'+r.id);
    if(el) el.textContent = fmt(calcRoom(r));
  });
}

// ==================== ОТРИСОВКА ====================
function render(){
  const c = document.getElementById('roomsContainer');
  if(!c) return;
  c.innerHTML = '';
  state.rooms.forEach(r=>{
    const d = document.createElement('div');
    d.className = 'room'+(r.open?' open':'');
    d.innerHTML = renderRoom(r);
    c.appendChild(d);
  });
  recalc();
}

function renderRoom(r){
  const rt = fmt(calcRoom(r));
  let ih = '';
  r.items.forEach(it=>{ ih += renderItem(r,it); });
  const ni = r.name==='custom'
    ? `<input type="text" value="${esc(r.customName)}" placeholder="Название" oninput="setCustomName('${r.id}',this.value)" style="flex:1;max-width:200px;">`
    : '';
  return `
    <div class="room-header">
      <input type="checkbox" ${r.enabled?'checked':''} onchange="toggleRoom('${r.id}','enabled')">
      <select onchange="setRoomName('${r.id}',this.value)">
        ${ROOM_NAMES.map(n=>`<option ${r.name===n?'selected':''}>${n}</option>`).join('')}
        <option value="custom" ${r.name==='custom'?'selected':''}>Своё название...</option>
      </select>
      ${ni}
      <span class="room-total" id="room_total_${r.id}">${rt}</span>
      <button class="small secondary" onclick="event.stopPropagation();toggleRoom('${r.id}','open')">${r.open?'▼':'▶'}</button>
      <button class="danger" onclick="event.stopPropagation();removeRoom('${r.id}')">✕</button>
    </div>
    <div class="room-body">
      ${ih}
      <button class="small" onclick="addItem('${r.id}')">+ Добавить изделие</button>
    </div>`;
}

function renderItem(r,it){
  const c = calcItem(it);
  const cats = Object.keys(PRICE);
  const works = PRICE[it.category]||[];
  const h = parseFloat(it.height)||0;
  const w = parseFloat(it.width)||0;

  // Основная работа — с учётом минимума 2м
  const rawQ = parseFloat(it.mainQty)||0;
  const effQ = c.effQty || rawQ;
  const minLabel = (effQ > rawQ && rawQ > 0) ? ` <small style="color:#e67e22">(мин. 2 м)</small>` : '';

  const pl = c.work
    ? (c.basePct > 0 ? `${Math.round(c.effectivePrice)} ₽ <small>${c.work.price} + ${c.basePct}%</small>` : `${c.work.price} ₽`)
    : '—';

  const mainRow = `
    <div class="row">
      <select onchange="updateItem('${r.id}','${it.id}','mainWork',this.value);autoAddTape('${r.id}','${it.id}');render();">
        <option value="">— выберите работу —</option>
        ${works.map(x=>`<option ${it.mainWork===x.name?'selected':''}>${x.name}</option>`).join('')}

// ==================== ВЕДОМОСТЬ ЗП ====================
function calcMasters(){
  const masters = [
    {name:'Швея 1',sum:0,items:0},
    {name:'Швея 2',sum:0,items:0},
    {name:'Швея 3',sum:0,items:0},
    {name:'Закройщик',sum:0,items:0}
  ];
  let totalWork = 0, totalMaterials = 0;

  state.rooms.forEach(r=>{
    if(!r.enabled) return;
    r.items.forEach(it=>{
      const c = calcItem(it);
      if(!c.work) return;
      // Работа = база с наценками + допы без материалов + объёмные наценки
      const workSum = c.baseWithMarkups + (c.linesSum - c.materialsSum) + c.volumeMarkupsSum;
      const matSum = c.materialsSum;
      totalWork += workSum;
      totalMaterials += matSum;

      const fund = workSum / 2;
      const mi = it.masterIdx;
      if(mi === 3) return; // не указан

      if(it.masterCuts){
        // Кроит сама → 100% швее
        masters[mi].sum += fund;
        masters[mi].items += 1;
      } else {
        // С закройщиком: 30% закройщику, 70% швее
        masters[mi].sum += fund * 0.7;
        masters[3].sum += fund * 0.3;
        masters[mi].items += 1;
        masters[3].items += 1;
      }
    });
  });

  const totalFund = totalWork / 2;
  const profit = totalWork / 2;
  return {masters, totalWork, totalMaterials, totalFund, profit};
}

const STORAGE_KEY = 'curtain_calc_orders';

function getSavedOrders(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch(e){ return []; }
}
function setSavedOrders(arr){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }
  catch(e){ alert('Не удалось сохранить: браузер запретил хранилище. Сделайте резервную копию.'); }
}

function saveToCloud(){
  syncHeaderToState();
  const orders = getSavedOrders();
  const id = 'order_' + Date.now();
  const order = {
    id,
    savedAt: new Date().toISOString(),
    state: JSON.parse(JSON.stringify(state))
  };
  // Если есть — обновить по совпадению orderNum+projectName
  const existingIdx = orders.findIndex(o=>o.state.orderNum && o.state.orderNum === state.orderNum && o.state.projectName === state.projectName);
  if(existingIdx >= 0){
    orders[existingIdx] = order;
  } else {
    orders.push(order);
  }
  setSavedOrders(orders);
  alert('✅ Расчёт сохранён в «Мои расчёты»');
}

// Полная сумма сохранённого расчёта (как в самом расчёте, с допами, наценками и срочностью)
function calcStateTotal(st){
  const rooms = (st.rooms||[]).reduce((s,r)=>{
    if(!r.enabled) return s;
    return s + (r.items||[]).reduce((ss,i)=>ss + calcItem(i).total, 0);
  }, 0);
  return rooms * (1 + urgencyPct(st));
}

        <div class="saved-sum">${fmt(total)}</div>
        <button class="small" onclick="loadOrder('${o.id}')">Открыть</button>
        <button class="small danger" onclick="deleteOrder('${o.id}')">✕</button>
      </div>`;
    }).join('');
  }
  panel.style.display = 'block';
}
function hideSaved(){ document.getElementById('savedPanel').style.display = 'none'; }

// Счётчики продолжают нумерацию загруженного расчёта, чтобы id не повторялись
function restoreCounters(){
  const num = s => parseInt(String(s||'').replace(/\D/g,''))||0;
  roomCounter = 0; itemCounter = 0;
  state.rooms.forEach(r=>{
    roomCounter = Math.max(roomCounter, num(r.id));
    (r.items||[]).forEach(i=>{ itemCounter = Math.max(itemCounter, num(i.id)); });
  });
}

function loadOrder(id){
  const orders = getSavedOrders();
  const order = orders.find(o=>o.id===id);
  if(!order){ alert('Расчёт не найден'); return; }
  state = JSON.parse(JSON.stringify(order.state));
  if(!Array.isArray(state.rooms)) state.rooms = [];
  restoreCounters();
  document.getElementById('orderNum').value = state.orderNum||'';
  document.getElementById('readyDate').value = state.readyDate||'';
  document.getElementById('designer').value = state.designer||'';
  document.getElementById('projectName').value = state.projectName||'';
  document.getElementById('urgency50').checked = state.urgency50||false;
  document.getElementById('urgency100').checked = state.urgency100||false;
  hideSaved();
  render();
}

function deleteOrder(id){
  if(!confirm('Удалить этот расчёт?')) return;
  const orders = getSavedOrders().filter(o=>o.id!==id);
  setSavedOrders(orders);
  showSaved();
}

function newOrder(){
  if(!confirm('Начать новый расчёт? Текущий будет очищен (если не сохранён в список).')) return;
  state = {orderNum:'',readyDate:'',designer:'',projectName:'',rooms:[],urgency50:false,urgency100:false};
  document.getElementById('orderNum').value='';
  document.getElementById('readyDate').value='';
  document.getElementById('designer').value='';
  document.getElementById('projectName').value='';
  document.getElementById('urgency50').checked=false;
  document.getElementById('urgency100').checked=false;
  roomCounter=0; itemCounter=0;
  hideSaved();
  render();
}

function exportBackup(){
  const orders = getSavedOrders();
  const json = JSON.stringify(orders, null, 2);
  const blob = new Blob([json],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toLocaleDateString('ru-RU').replace(/\./g,'-');
  a.href = url;
  a.download = 'Заказы_'+d+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(!Array.isArray(imported)) throw new Error('Неверный формат');
        if(!confirm('Добавить ' + imported.length + ' расчётов из файла? Существующие останутся.')) return;
        const cur = getSavedOrders();
        setSavedOrders(cur.concat(imported));
        alert('✅ Импортировано: ' + imported.length);
        showSaved();
      }catch(err){ alert('Ошибка: '+err.message); }
    };
    r.readAsText(f);
  };
  input.click();
}

// ==================== СОБЫТИЯ ====================
function syncHeaderToState(){
  state.orderNum = document.getElementById('orderNum').value;
  state.readyDate = document.getElementById('readyDate').value;
  state.designer = document.getElementById('designer').value;
  state.projectName = document.getElementById('projectName').value;
  state.urgency50 = document.getElementById('urgency50').checked;
  state.urgency100 = document.getElementById('urgency100').checked;
}
document.getElementById('orderNum').addEventListener('input',e=>state.orderNum=e.target.value);
document.getElementById('readyDate').addEventListener('input',e=>state.readyDate=e.target.value);
document.getElementById('designer').addEventListener('input',e=>state.designer=e.target.value);
document.getElementById('projectName').addEventListener('input',e=>state.projectName=e.target.value);
// Срочность: включается только один вариант
document.getElementById('urgency50').addEventListener('change',e=>{
  state.urgency50=e.target.checked;
  if(state.urgency50){ state.urgency100=false; document.getElementById('urgency100').checked=false; }
  recalc();
});
document.getElementById('urgency100').addEventListener('change',e=>{
  state.urgency100=e.target.checked;
  if(state.urgency100){ state.urgency50=false; document.getElementById('urgency50').checked=false; }
  recalc();
});

render();
</script>
</body>
